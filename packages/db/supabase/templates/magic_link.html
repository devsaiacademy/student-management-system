<!doctype html>
<html lang="en">
  <body style="background-color: #f6f8fa; margin: 0; padding: 0">
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f6f8fa"
    >
      <tr>
        <td align="center" style="padding: 48px 16px">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 8px"
          >
            <tr>
              <td
                style="
                  padding: 40px 32px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                    Roboto, sans-serif;
                "
              >
                <img
                  alt="Otomatiks"
                  src="https://www.otomatiks.com/assets/logo-C4Uek5Wt.svg"
                  width="200"
                  height="141"
                  style="display: block; margin: 0 auto"
                />

                <h1
                  style="
                    color: #111;
                    font-size: 22px;
                    font-weight: 600;
                    margin: 24px 0 12px;
                    font-family: inherit;
                  "
                >
                  Sign in to your account
                </h1>

                <p
                  style="
                    color: #444;
                    font-size: 15px;
                    line-height: 22px;
                    margin: 0 0 24px;
                    font-family: inherit;
                  "
                >
                  Click the button below to finish signing in, or enter the code
                  in the app. The link and code expire in 10 minutes and can
                  only be used once.
                </p>

                <div style="margin: 28px 0; text-align: center">
                  <a
                    href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
                    style="
                      background-color: #0769ab;
                      color: #ffffff;
                      border-radius: 5px;
                      font-size: 16px;
                      font-weight: 600;
                      width: 170px;
                      height: 40px;
                      line-height: 40px;
                      text-align: center;
                      text-decoration: none;
                      display: inline-block;
                      font-family: inherit;
                    "
                  >
                    Sign in
                  </a>
                </div>

                <p
                  style="
                    color: #444;
                    font-size: 13px;
                    line-height: 20px;
                    margin: 0 0 8px;
                    font-family: inherit;
                  "
                >
                  Or enter this code in the app:
                </p>

                <div
                  style="
                    background-color: #f6f8fa;
                    border-radius: 6px;
                    padding: 10px 16px;
                    display: inline-block;
                    margin: 8px 0 0;
                  "
                >
                  <span
                    style="
                      color: #111;
                      font-family:
                        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                        monospace;
                      font-size: 22px;
                      font-weight: 700;
                      letter-spacing: 6px;
                    "
                    >{{ .Token }}</span
                  >
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
