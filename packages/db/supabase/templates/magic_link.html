<!doctype html>
<html lang="en">
  <body style="background-color:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:10px;padding:0;">
    <div style="background-color:#ffffff;margin:40px auto;padding:40px 32px;max-width:480px;border-radius:8px;">
      <img
        alt="Otomatiks"
        src="https://www.otomatiks.com/assets/logo-C4Uek5Wt.svg"
        width="200"
        height="141"
        style="display:block;margin:0 auto;"
      />

      <h1 style="color:#111;font-size:22px;font-weight:600;margin:24px 0 12px;">
        Sign in to your account
      </h1>

      <p style="color:#444;font-size:15px;line-height:22px;margin:0 0 24px;">
        Click the button below to finish signing in, or enter the code in the app.
        The link and code expire in 10 minutes and can only be used once.
      </p>

      <div style="margin:28px 0;">
        <a
          href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
          style="background-color:#0769AB;color:#ffffff;border-radius:5px;font-size:16px;font-weight:600;width:170px;height:40px;line-height:40px;text-align:center;text-decoration:none;display:inline-block;"
        >
          Sign in
        </a>
      </div>

      <p style="color:#444;font-size:13px;line-height:20px;margin:0 0 8px;">
        Or enter this code in the app:
      </p>
      <div style="background-color:#f6f8fa;border-radius:6px;padding:16px;text-align:center;margin:8px 0 24px;">
        <p style="color:#111;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:28px;font-weight:700;letter-spacing:8px;margin:0;">
          {{ .Token }}
        </p>
      </div>

      <hr style="border:none;border-top:1px solid #eee;margin:32px 0 16px;" />

      <p style="color:#888;font-size:12px;line-height:18px;margin:0;">
        If you didn't request this email, you can safely ignore it.
      </p>
    </div>
  </body>
</html>
